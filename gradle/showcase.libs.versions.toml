[versions]
kotlin = "2.2.0"

[libraries]
androidx-appcompat = { module = "androidx.appcompat:appcompat", version = "1.7.1" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version = "1.8.8" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version = "2025.07.00" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3-android = { module = "androidx.compose.material3:material3-android" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }

[plugins]
androidx-compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
